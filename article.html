<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chargement...</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="m-0 bg-white text-[#1a1a1a] pt-[70px]">
<header class="fixed top-0 left-0 w-full z-30 bg-white shadow">
<div class="h-[70px] w-full flex justify-between items-center px-[30px] gap-10">
<a href="https://flatway.fr/"><img src="https://flatway.fr/_next/static/media/appIcon.4beb43c9.webp" width="48"></a>
<div class="hidden sm:flex w-full px-[10px]">
<a href="https://flatway.fr/estimation" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium">Estimer</a>
<a href="#" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium">Acheter</a>
<a href="#" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium">Vendre</a>
</div></div></header>
<div id="app"></div>
<script>
const slug=new URLSearchParams(location.search).get('slug');
fetch('./articles-blog.json').then(r=>r.json()).then(data=>{
const article=data.articles.find(a=>a.slug===slug);
if(!article) return;
document.title=article.seo_title||article.title;
document.getElementById('app').innerHTML=`<section class="bg-white px-5 pt-[42px] pb-[24px]">
<div class="max-w-[760px] mx-auto">
<div class="text-[13px] text-gray-500 mb-4">Blog › ${article.category||''}</div>
<div class="inline-flex items-center gap-2 rounded-full px-3 py-1 bg-[#f6f1ef] text-[#7A1E1E] text-[11px] uppercase tracking-[0.12em] mb-4">${article.category||''}</div>
<h1 class="text-[42px] leading-[1.15] font-bold text-[#111] mb-5">${article.title}</h1>
<p class="text-[20px] leading-[1.7] text-[#555] mb-6">${article.excerpt||''}</p>
<div class="flex items-center gap-3 text-[14px] text-gray-600 mb-8"><div><div class="font-medium text-[#111]">${article.author||'Flatway'}</div><div>Temps de lecture : ${article.reading_time||''} min</div></div></div>
${article.featured_image?`<img src="${article.featured_image}" class="w-full rounded-[20px]">`:''}
</div></section>
<main class="pt-8 pb-16 px-5"><div class="max-w-[760px] mx-auto">${article.content_html||''}</div></main>`;
});
</script></body></html>
