<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chargement...</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter,sans-serif;
-webkit-font-smoothing:antialiased;
}

.article-content img{
width:100%;
height:auto;
border-radius:20px;
margin:32px 0;
display:block;
}

.article-content figure{
margin:32px 0;
}

.article-content iframe{
width:100%;
border-radius:20px;
}

.article-content h2{
font-size:2rem;
font-weight:700;
margin:48px 0 20px;
line-height:1.2;
}

.article-content h3{
font-size:1.5rem;
font-weight:700;
margin:36px 0 16px;
}

.article-content p{
margin:18px 0;
line-height:1.9;
color:#333;
}

.article-content ul,
.article-content ol{
padding-left:24px;
margin:20px 0;
}

.article-content li{
margin:8px 0;
}

.article-content blockquote{
border-left:4px solid #7A1E1E;
padding-left:20px;
margin:24px 0;
font-style:italic;
}
</style>
</head>

<body class="m-0 bg-white text-[#1a1a1a] pt-[70px]">

<header class="fixed top-0 left-0 w-full z-30 bg-white shadow">
<div class="h-[70px] w-full flex justify-between items-center px-[30px] gap-10">

<a href="https://flatway.fr/" aria-label="Accueil">
<img src="https://flatway.fr/_next/static/media/appIcon.4beb43c9.webp" width="48" height="48" alt="Flatway">
</a>

<div class="hidden sm:flex w-full px-[10px]">
<a href="https://flatway.fr/estimation" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium hover:bg-gray-100">Estimer</a>
<a href="https://flatway.fr/consultation?searchAreaId=paris-75001-75056&propertyTypes=1,2" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium hover:bg-gray-100">Acheter</a>
<a href="https://flatway.fr/comment-vendre" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium hover:bg-gray-100">Vendre</a>
</div>

<a href="https://flatway.fr/login/professionnel"
class="hidden md:flex items-center gap-2 whitespace-nowrap border border-gray-200 px-4 py-2 rounded-md hover:bg-gray-50">
Se connecter
</a>

</div>
</header>

<div id="app"></div>

<script>

const slug = new URLSearchParams(location.search).get('slug');

fetch('./articles-blog.json')
.then(r => r.json())
.then(data => {

const article = data.articles.find(a => a.slug === slug);

if(!article){
document.getElementById('app').innerHTML = `
<div class="max-w-5xl mx-auto px-5 py-20">
<h1 class="text-4xl font-bold">Article introuvable</h1>
</div>
`;
return;
}

document.title = article.seo_title || article.title;

const related = data.articles
.filter(a =>
a.slug !== article.slug &&
a.category &&
article.category &&
a.category.toLowerCase() === article.category.toLowerCase()
)
.slice(0,2);

document.getElementById('app').innerHTML = `

<section class="bg-[#fafafa] border-b border-gray-100">
<div class="max-w-[1100px] mx-auto px-5 py-12">

<div class="mb-6 text-sm text-gray-500 flex flex-wrap items-center gap-1">
<a href="/">Accueil</a>
<span>›</span>
<a href="/blog">Blog</a>

${article.category ? `
<>
<span>›</span>
<span class="capitalize">${article.category}</span>
</>
` : ''}
</div>

<div class="max-w-[760px]">

${article.category ? `
<div class="inline-flex items-center rounded-full bg-[#f6f1ef] px-4 py-2 text-[#7A1E1E] text-xs uppercase tracking-wider mb-5">
${article.category}
</div>
` : ''}

<h1 class="text-[42px] md:text-[56px] leading-[1.05] font-bold mb-6 text-[#111]">
${article.title}
</h1>

${article.excerpt ? `
<p class="text-xl text-gray-600 leading-relaxed mb-8">
${article.excerpt}
</p>
` : ''}

<div class="flex flex-wrap items-center gap-8 text-sm text-gray-600">

<div>
<div class="font-semibold text-[#111]">
${article.author || 'Rédaction Flatway'}
</div>
</div>

${article.reading_time ? `
<div>
Temps de lecture : ${article.reading_time} min
</div>
` : ''}

</div>

</div>

${article.featured_image ? `
<div class="mt-10">
<img
src="${article.featured_image}"
alt="${article.title}"
class="w-full rounded-[24px] object-cover">
</div>
` : ''}

</div>
</section>

<main class="py-16 px-5">
<div class="max-w-[760px] mx-auto article-content">
${article.content_html || ''}
</div>

${related.length ? `
<section class="max-w-[1100px] mx-auto border-t border-gray-200 mt-20 pt-14">

<h2 class="text-3xl font-bold mb-10">
À lire également
</h2>

<div class="grid md:grid-cols-2 gap-8">

${related.map(item => `
<a href="?slug=${item.slug}" class="group block">

${item.featured_image ? `
<img
src="${item.featured_image}"
alt="${item.title}"
class="w-full aspect-[16/9] object-cover rounded-2xl mb-4">
` : ''}

${item.category ? `
<div class="text-sm text-[#7A1E1E] mb-2">
${item.category}
</div>
` : ''}

<h3 class="font-semibold text-lg leading-snug group-hover:text-[#7A1E1E] transition">
${item.title}
</h3>

${item.excerpt ? `
<p class="text-sm text-gray-600 mt-2">
${item.excerpt}
</p>
` : ''}

</a>
`).join('')}

</div>

</section>
` : ''}
</main>
`;

if(article.meta_description){
let meta = document.querySelector('meta[name="description"]');

if(!meta){
meta = document.createElement('meta');
meta.name = 'description';
document.head.appendChild(meta);
}

meta.content = article.meta_description;
}

})
.catch(error => {

document.getElementById('app').innerHTML = `
<div class="max-w-5xl mx-auto px-5 py-20">
<h1 class="text-4xl font-bold mb-4">Erreur de chargement</h1>
<p>${error}</p>
</div>
`;

});

</script>

</body>
</html>
