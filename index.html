<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Flatway</title>
<meta name="description" content="Guides et conseils immobiliers">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
background:#faf7f5;
}

.article-card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 18px rgba(0,0,0,.05);
transition:.2s;
}

.article-card:hover{
transform:translateY(-4px);
}

.article-card img{
width:100%;
height:220px;
object-fit:cover;
}

.article-title{
font-size:20px;
font-weight:600;
margin-bottom:10px;
color:#2b1b1b;
}

.article-description{
font-size:14px;
color:#555;
line-height:1.6;
}
</style>

</head>

<body>

<header class="bg-[#7A1E1E] text-white py-16 px-6 text-center">
<h1 class="text-5xl font-bold mb-4">
Blog Flatway
</h1>

<p class="max-w-3xl mx-auto text-lg">
Conseils immobiliers, achat, vente, investissement,
financement et stratégies immobilières.
</p>
</header>

<section class="max-w-[1240px] mx-auto px-5 py-12">

<input
id="search"
type="text"
placeholder="Rechercher un article..."
class="w-full p-4 rounded-xl border border-gray-300 mb-10"
/>

<div
id="articles"
class="grid md:grid-cols-3 gap-6">
</div>

</section>

<script>

let allArticles = [];

fetch('./articles-blog.json')
.then(r => r.json())
.then(data => {

allArticles = data.articles || [];

render(allArticles);

});

function render(list){

const container =
document.getElementById('articles');

container.innerHTML = list.map(article => `

<a
href="article.html?slug=${article.slug}"
class="article-card block">

${article.image ? `
<img
src="${article.image}"
alt="${article.title}">
` : ''}

<div class="p-5">

<h2 class="article-title">
${article.title || ''}
</h2>

<p class="article-description">
${article.meta_description || ''}
</p>

</div>

</a>

`).join('');

}

document
.getElementById('search')
.addEventListener('input', e => {

const q =
e.target.value.toLowerCase();

render(
allArticles.filter(a =>
(a.title || '')
.toLowerCase()
.includes(q)
)
);

});

</script>

</body>
</html>
