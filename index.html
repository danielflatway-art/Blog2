<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Flatway</title>
<meta name="description" content="Guides et conseils immobiliers">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
background:#faf7f5;
margin:0;
}

.article-card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 8px 18px rgba(0,0,0,.05);
transition:.2s;
height:100%;
display:flex;
flex-direction:column;
}

.article-card:hover{
transform:translateY(-4px);
}

.article-card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.article-title{
font-size:20px;
font-weight:600;
margin-bottom:10px;
color:#2b1b1b;
line-height:1.3;
}

.article-description{
font-size:14px;
color:#555;
line-height:1.6;
flex:1;
}

.article-category{
font-size:12px;
font-weight:600;
text-transform:uppercase;
letter-spacing:.08em;
color:#7A1E1E;
margin-bottom:12px;
}

.article-meta{
margin-top:16px;
font-size:13px;
color:#777;
}

.no-result{
grid-column:1/-1;
text-align:center;
padding:40px;
color:#666;
}
</style>

</head>

<body>

<header class="bg-[#7A1E1E] text-white py-16 px-6 text-center">
<h1 class="text-5xl font-bold mb-4">
Blog Flatway
</h1>

<p class="max-w-3xl mx-auto text-lg">
Conseils immobiliers, achat, vente, investissement,
financement et stratégies immobilières.
</p>
</header>

<section class="max-w-[1240px] mx-auto px-5 py-12">

<input
id="search"
type="text"
placeholder="Rechercher un article..."
class="w-full p-4 rounded-xl border border-gray-300 mb-10"
/>

<div
id="articles"
class="grid md:grid-cols-3 gap-6">
</div>

</section>

<script>

let allArticles = [];

fetch('./articles-blog.json')
.then(response => {

if(!response.ok){
throw new Error('Impossible de charger le JSON');
}

return response.json();

})
.then(data => {

allArticles = data.articles || [];

render(allArticles);

})
.catch(error => {

console.error(error);

document.getElementById('articles').innerHTML = `
<div class="no-result">
Impossible de charger les articles.
</div>
`;

});

function render(list){

const container = document.getElementById('articles');

if(!list.length){

container.innerHTML = `
<div class="no-result">
Aucun article trouvé.
</div>
`;

return;

}

container.innerHTML = list.map(article => `

<a
href="article.html?slug=${encodeURIComponent(article.slug || '')}"
class="article-card block">

${article.featured_image ? `
<img
src="${article.featured_image}"
alt="${article.featured_image_alt || article.title || ''}">
` : ''}

<div class="p-5 flex flex-col h-full">

<div class="article-category">
${article.category || ''}
</div>

<h2 class="article-title">
${article.title || ''}
</h2>

<p class="article-description">
${article.excerpt || article.meta_description || ''}
</p>

<div class="article-meta">
${article.reading_time ? `${article.reading_time} min de lecture` : ''}
</div>

</div>

</a>

`).join('');

}

document
.getElementById('search')
.addEventListener('input', e => {

const q = e.target.value.toLowerCase().trim();

render(
allArticles.filter(article => {

const title =
(article.title || '').toLowerCase();

const excerpt =
(article.excerpt || '').toLowerCase();

const description =
(article.meta_description || '').toLowerCase();

const category =
(article.category || '').toLowerCase();

return (
title.includes(q) ||
excerpt.includes(q) ||
description.includes(q) ||
category.includes(q)
);

})
);

});

</script>

</body>
</html>
