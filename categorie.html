<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Catégorie | Blog Flatway</title>

<meta name="description" content="Tous les articles d'une catégorie du blog Flatway">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
margin:0;
font-family:Inter,sans-serif;
background:#faf7f5;
-webkit-font-smoothing:antialiased;
}

.article-card{
background:white;
border-radius:18px;
overflow:hidden;
border:1px solid rgba(0,0,0,.05);
box-shadow:0 8px 18px rgba(0,0,0,.05);
transition:.25s;
display:block;
}

.article-card:hover{
transform:translateY(-4px);
box-shadow:0 14px 30px rgba(0,0,0,.08);
}

.article-img{
width:100%;
height:220px;
object-fit:cover;
}

.cat{
font-size:12px;
text-transform:uppercase;
letter-spacing:.12em;
color:#7A1E1E;
font-weight:600;
display:block;
margin-bottom:6px;
}

.article-title{
font-size:18px;
font-weight:600;
color:#2b1b1b;
margin-bottom:8px;
line-height:1.4;
}

.article-text{
font-size:14px;
line-height:1.6;
color:#555;
}

.pagination-btn{
min-width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:white;
border:1px solid rgba(0,0,0,.08);
font-weight:600;
}

.pagination-btn.active{
background:#7A1E1E;
color:white;
border-color:#7A1E1E;
}
</style>
</head>

<body class="pt-[70px]">

<header class="fixed top-0 left-0 w-full z-30 bg-white shadow">
<div class="h-[70px] w-full flex justify-between items-center px-[30px] gap-10">

<a href="https://flatway.fr/" aria-label="Accueil">
<img src="https://flatway.fr/_next/static/media/appIcon.4beb43c9.webp" width="48" height="48" alt="Flatway">
</a>

<div class="hidden sm:flex w-full px-[10px]">
<a href="https://flatway.fr/estimation" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium hover:bg-gray-100">Estimer</a>
<a href="https://flatway.fr/consultation?searchAreaId=paris-75001-75056&propertyTypes=1,2" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium hover:bg-gray-100">Acheter</a>
<a href="https://flatway.fr/comment-vendre" class="text-[#980000] px-2 py-2 rounded-lg text-md font-medium hover:bg-gray-100">Vendre</a>
</div>

<a href="https://flatway.fr/login/professionnel" class="flex items-center gap-2 whitespace-nowrap border border-gray-200 px-4 py-2 rounded-md hover:bg-gray-50">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
</svg>
Se connecter
</a>

</div>
</header>

<section class="text-white py-16 px-5"
style="background:radial-gradient(circle at top left,#a23a3a 0,#7A1E1E 40%,#4a1111 90%);">

<div class="max-w-[1240px] mx-auto">

<div class="text-sm opacity-80 mb-3">
<a href="index.html" class="hover:underline">Blog</a>
<span>›</span>
<span id="breadcrumbCategory"></span>
</div>

<h1 id="pageTitle"
class="text-[42px] md:text-[52px] font-bold mb-4">
Chargement...
</h1>

<p id="pageDescription"
class="max-w-[700px] text-[18px] opacity-90">
Chargement...
</p>

</div>

</section>

<main class="max-w-[1240px] mx-auto px-5 py-14">

<div class="flex items-center justify-between mb-10">

<h2 id="sectionTitle"
class="text-[28px] font-bold text-[#2b1b1b]">
Articles
</h2>

<div id="articleCount"
class="text-sm text-gray-500">
</div>

</div>

<div id="articlesGrid"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">
</div>

<div id="pagination"
class="flex justify-center gap-2 mt-14 flex-wrap">
</div>

</main>

<script>

const CATEGORY_LABELS = {
acheter:"Acheter",
déménagement:"Déménagement",
entreprise:"Immobilier d'entreprise",
estimer:"Estimer",
financement:"Financement",
ia:"L'IA dans l'immobilier",
louer:"Louer",
pro:"Pro de l'immobilier",
renovation:"Rénovation",
vendre:"Vendre"
};

const params = new URLSearchParams(window.location.search);

const categorySlug = (params.get("categorie") || "").toLowerCase();

const currentPage = parseInt(params.get("page") || "1");

const perPage = 30;

fetch("./articles-blog.json")
.then(r=>r.json())
.then(data=>{

const allArticles = data.articles || [];

const articles = allArticles.filter(article =>
(article.category || "").toLowerCase() === categorySlug
);

const categoryName =
CATEGORY_LABELS[categorySlug] ||
categorySlug.charAt(0).toUpperCase()+categorySlug.slice(1);

document.title =
categoryName + " | Blog Flatway";

document.getElementById("pageTitle").textContent =
categoryName;

document.getElementById("breadcrumbCategory").textContent =
categoryName;

document.getElementById("sectionTitle").innerHTML =
"Tous les articles : <span class='text-[#7A1E1E]'>" +
categoryName +
"</span>";

document.getElementById("pageDescription").textContent =
"Découvrez tous nos articles, guides et conseils dédiés à la catégorie " +
categoryName +
".";

document.getElementById("articleCount").textContent =
articles.length + " article(s)";

const totalPages =
Math.ceil(articles.length / perPage);

const start =
(currentPage - 1) * perPage;

const end =
start + perPage;

const pageArticles =
articles.slice(start,end);

document.getElementById("articlesGrid").innerHTML =
pageArticles.map(article => `
<a href="article.html?slug=${article.slug}"
class="article-card">

${article.featured_image ? `
<img src="${article.featured_image}"
alt="${article.title}"
class="article-img">
` : ""}

<div class="p-5">

<span class="cat">
${categoryName}
</span>

<h3 class="article-title">
${article.title}
</h3>

<p class="article-text">
${article.meta_description || ""}
</p>

</div>

</a>
`).join("");

if(totalPages > 1){

let html = "";

for(let i=1;i<=totalPages;i++){

html += `
<a
href="?categorie=${encodeURIComponent(categorySlug)}&page=${i}"
class="pagination-btn ${i===currentPage ? 'active' : ''}">
${i}
</a>
`;

}

document.getElementById("pagination").innerHTML =
html;

}

});
</script>

</body>
</html>
